name: Dreamy Elsewhere — Publish first Reel once

# One-off Dreamy-only bridge. Runs on its isolated branch using the existing
# Buffer API key. Never triggers BlinkPuzz production and never posts to it.
on:
  push:
    branches:
      - dreamy-post-20261117
    paths:
      - '.github/workflows/dreamy-buffer-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamy-elsewhere-one-off-buffer-post
  cancel-in-progress: false

jobs:
  publish-first-dreamy-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Dreamy Elsewhere project only
        uses: actions/checkout@v4
        with:
          repository: lucadimichele-svg/dreamy-elsewhere-automation-
          ref: main
          path: dreamy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Buffer client dependency
        run: python -m pip install "requests>=2.32,<3"
      - name: Publish ONLY DE20261117S1 to exact @dreamy_elsewhere now
        working-directory: dreamy
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          DREAMY_POST_ONCE: "true"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BUFFER_API_KEY:-}" ]; then
            echo "Missing existing Buffer API secret; nothing published" >&2
            exit 1
          fi
          python src/publish_now.py
