name: BlinkPuzz V2 offline validation
on:
  pull_request:
    branches: [blinkpuzz-2-dev]
    paths: ['blinkpuzz2/**', 'tests_v2/**', '.github/workflows/blinkpuzz-v2-dev.yml']
  workflow_dispatch:
    inputs:
      pilots:
        description: Render the full pilot collection
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: github.base_ref == 'blinkpuzz-2-dev' || github.ref == 'refs/heads/blinkpuzz-2-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-dejavu-extra
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests tests_v2
      - if: inputs.pilots
        run: python -m blinkpuzz2.cli pilots --count 20 --seed 20261127 --out build/v2/pilots
      - if: inputs.pilots
        uses: actions/upload-artifact@v4
        with:
          name: blinkpuzz-2-pilots
          path: build/v2/pilots.zip
          retention-days: 7
