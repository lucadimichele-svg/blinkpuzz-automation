name: BlinkPuzz Buffer Queue Refill

on:
  workflow_dispatch:
  schedule:
    # Refill after publishing slots during the day (UTC; Berlin winter).
    # Production remains in the separate daily workflow.
    - cron: '19 9,13,19,21 * * *'

jobs:
  refill-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: blinkpuzz-buffer-queue
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      QUEUE_STATUS: unknown
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "requests>=2.32,<3"
      - name: Refill only the verified @blinkpuzz channel
        id: queue
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python src/publish.py 2>&1 | tee /tmp/blinkpuzz-refill.log
      - name: Audit upcoming experiment posts (read-only)
        if: always()
        continue-on-error: true
        run: python src/experiment_report.py
      - name: Save the non-secret refill status
        if: always()
        shell: bash
        env:
          QUEUE_OUTCOME: ${{ steps.queue.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          log_path=Path('/tmp/blinkpuzz-refill.log')
          log=log_path.read_text(errors='replace') if log_path.exists() else ''
          status={
              'checked_at_utc': datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'result': os.environ.get('QUEUE_OUTCOME','unknown'),
              'channel': '@blinkpuzz',
              'buffer_connection_verified': 'Verified Buffer account @blinkpuzz' in log,
              'queued_count_this_run': len(re.findall(r'^Scheduled BP[0-9]{8}(?:B[123]|N1)? ', log, re.M)),
              'publishing_enabled': os.getenv('AUTO_PUBLISH','').lower() == 'true',
              'target_cadence': '4 daily through 2026-11-16, then 2 daily',
              'note': 'This reports Buffer queueing only, not actual Instagram delivery.'
          }
          Path('docs/automation_status.json').write_text(json.dumps(status,indent=2)+'\n')
          print('PUBLICATION STATUS:',json.dumps(status))
          PY
          git config user.name 'blinkpuzz-bot'
          git config user.email 'blinkpuzz-bot@users.noreply.github.com'
          git add docs/automation_status.json
          if [ -f docs/experiment_status.json ]; then git add docs/experiment_status.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: report BlinkPuzz queue refill'
            git pull --rebase origin main
            git push
          fi
      - name: Surface Buffer errors
        if: steps.queue.outcome == 'failure'
        run: exit 1
