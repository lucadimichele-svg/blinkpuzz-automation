name: BlinkPuzz Daily Production

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Once daily, at 06:17 UTC. GitHub schedules may be delayed.
    - cron: '17 6 * * *'

concurrency:
  group: blinkpuzz-daily
  cancel-in-progress: false

jobs:
  produce-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-lato fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Validate puzzle algorithms
        run: pytest -q tests
      - name: Render 7-day inventory for Option B and prune old media
        run: python src/batch.py
      - name: Validate output media
        run: python src/validate.py docs/media
      - name: Commit generated media only
        run: |
          git config user.name 'blinkpuzz-bot'
          git config user.email 'blinkpuzz-bot@users.noreply.github.com'
          git add -A docs/media
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'chore: update BlinkPuzz rolling reel buffer'
            git push
          fi

  deploy-media:
    needs: produce-reels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

  publish-queue:
    needs: deploy-media
    concurrency:
      group: blinkpuzz-buffer-queue
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API dependency
        run: pip install "requests>=2.32,<3"
      - name: Queue Reels only for verified BlinkPuzz Instagram account
        id: queue
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python src/publish.py 2>&1 | tee /tmp/blinkpuzz-publisher.log
      - name: Record safe publication summary
        if: always()
        env:
          QUEUE_OUTCOME: ${{ steps.queue.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          log_path=Path('/tmp/blinkpuzz-publisher.log')
          log=log_path.read_text(errors='replace') if log_path.exists() else ''
          summary={
            'checked_at_utc': datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'result': os.environ.get('QUEUE_OUTCOME','unknown'),
            'channel': '@blinkpuzz',
            'buffer_connection_verified': 'Verified Buffer account @blinkpuzz' in log,
            'queued_count_this_run': len(re.findall(r'^Scheduled BP[0-9]{8}(?:B[123]|N1)? ',log,re.M)),
            'publishing_enabled': os.getenv('AUTO_PUBLISH','').lower()=='true',
            'note': 'This reports Buffer scheduling only, not Instagram delivery.'
          }
          Path('docs/automation_status.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('PUBLICATION STATUS:',json.dumps(summary))
          PY
          git config user.name 'blinkpuzz-bot'
          git config user.email 'blinkpuzz-bot@users.noreply.github.com'
          git add docs/automation_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record BlinkPuzz publication status'
            git pull --rebase origin main
            git push
          fi
      - name: Fail workflow if Buffer scheduling failed
        if: steps.queue.outcome == 'failure'
        run: exit 1
